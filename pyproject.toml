[project]
name = "kb-agent"
version = "0.1.0"
description = "Local application troubleshooting knowledge agent POC"
requires-python = ">=3.12"
dependencies = [
  "chainlit>=1.3.2",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langchain>=0.3.0",
  "langchain-neo4j>=0.4.0",
  "langchain-openai>=0.2.0",
  "markdown-it-py>=3.0.0",
  "neo4j>=5.24.0",
  "pandas>=2.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "tiktoken>=0.7.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
